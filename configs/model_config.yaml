project:
  name: "slm-python-learning-assistant"
  version: "1.0.0"
  description: "AI-powered Python Learning Assistant using Small Language Models (SLM)"

hardware:
  target_device: "auto"  # auto-fallback to cpu on non-CUDA machines
  cpu_threads: 4
  precision: "float32"   # float32 for CPU stability, bfloat16/float16 for CUDA

candidates:
  qwen2_5_1_5b:
    model_id: "Qwen/Qwen2.5-1.5B-Instruct"
    params: "1.54B"
    context_length: 32768
    license: "Apache-2.0"
    default_revision: "main"
  smollm2_1_7b:
    model_id: "HuggingFaceTB/SmolLM2-1.7B-Instruct"
    params: "1.71B"
    context_length: 8192
    license: "Apache-2.0"
    default_revision: "main"
  llama_3_2_1b:
    model_id: "meta-llama/Llama-3.2-1B-Instruct"
    params: "1.23B"
    context_length: 131072
    license: "Llama 3.2 Community License"
    default_revision: "main"

selected_model:
  model_id: "Qwen/Qwen2.5-1.5B-Instruct"
  torch_dtype: "auto"

inference:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.1
  do_sample: true

dataset:
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  seed: 42
  raw_path: "data/raw"
  processed_path: "data/processed"
  train_file: "data/train.jsonl"
  validation_file: "data/validation.jsonl"
  test_file: "data/test.jsonl"

training:
  method: "lora"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  num_train_epochs: 3
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"
  output_dir: "models/lora_adapter"

api:
  host: "0.0.0.0"
  port: 8000
  reload: false
